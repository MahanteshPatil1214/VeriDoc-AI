server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: every path the router might navigate to falls back to the
    # single page, except the /api namespace which is not part of the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets never change; cache them aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The backend. proxy_buffering must be off so the SSE chat stream is
    # delivered to the browser as it is produced instead of being buffered.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}