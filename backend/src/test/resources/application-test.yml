spring:
  datasource:
    hikari:
      pool-name: veridoc-test-cp
      maximum-pool-size: 5

  ai:
    openai:
      # Tests never call Groq; the key exists so the OpenAI-compatible
      # auto-configuration can build its beans.
      api-key: test-key-not-used
    google:
      genai:
        embedding:
          # Tests never call Gemini; same reasoning as above.
          api-key: test-key-not-used

veridoc:
  jwt:
    secret: 0123456789abcdef0123456789abcdef0123456789abcdef
  rate-limit:
    enabled: false
  storage:
    root: ./target/test-storage
  retrieval:
    # DeterministicEmbeddingModel hashes words into 768 bins; the margin
    # between a vocabulary-overlapping query (>=0.4) and a disjoint one (<0.05)
    # is comfortable at 0.2.
    min-score: 0.2
  rag:
    debug-enabled: true
    # The deterministic chat stub answers with the passages themselves, which is
    # useless as a retrieval query, so rewriting stays off unless a test
    # explicitly turns it on (see QueryRewriteIT).
    enable-query-rewriting: false

logging:
  level:
    com.veridoc.ai: INFO
    org.testcontainers: INFO
    org.flywaydb: INFO
    org.hibernate: WARN
    tc: WARN
    com.github.dockerjava: WARN