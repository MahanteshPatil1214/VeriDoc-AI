spring:
  datasource:
    hikari:
      pool-name: veridoc-test-cp
      maximum-pool-size: 5

  ai:
    google:
      genai:
        # Tests never call Gemini; the key exists so the AI auto-configuration
        # can build its beans. Overridden per test where a stub is required.
        api-key: test-key-not-used
        chat:
          client:
            request-timeout: 2s

veridoc:
  jwt:
    secret: 0123456789abcdef0123456789abcdef0123456789abcdef
  rate-limit:
    enabled: false
  storage:
    root: ./target/test-storage
  retrieval:
    # DeterministicEmbeddingModel hashes words into 768 bins; the margin
    # between a vocabulary-overlapping query (>=0.4) and a disjoint one (<0.05)
    # is comfortable at 0.2.
    min-score: 0.2
  rag:
    debug-enabled: true

logging:
  level:
    com.veridoc.ai: INFO
    org.testcontainers: INFO
    org.flywaydb: INFO
    org.hibernate: WARN
    tc: WARN
    com.github.dockerjava: WARN